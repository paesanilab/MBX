name: Self-Hosted Integration test

on:
  workflow_dispatch:
    inputs:
      omp:
        description: 'OpenMP threads'
        required: true
        default: "1"
        type: number
      valgrind_check:
        description: 'Run optional Valgrind memory leak check'
        required: true
        default: false
        type: boolean

jobs:
  compile-mbxlammps:
    runs-on: [self-hosted]
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server!"
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v7
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "The workflow is now ready to test your code on the runner."
          
      - name: MBX-install
        run: |
          module unload intel || true
          ls ${{ github.workspace }}
          
          autoreconf -fi
          ./configure CXX=g++
          make -j 8
          make install
          
          echo "MBX_HOME=${{ github.workspace }}" >> "$GITHUB_ENV"
          
      - name: LAMMPS-Install
        run: |
          module unload intel || true
          export MBX_HOME=${{ env.MBX_HOME }}
          export PKG_CONFIG_PATH=${{ env.MBX_HOME }}/lib/pkgconfig
          git clone https://github.com/lammps/lammps.git -b release
          cd lammps
          
          cmake -S cmake -B build -C ./cmake/presets/basic.cmake -D PKG_MBX=yes -D PKG_EXTRA-PAIR=yes -D BUILD_MPI=no -D CMAKE_CXX_COMPILER=g++ -D CMAKE_C_COMPILER=gcc
          cmake --build build --parallel 4

      - name: Upload MBX+LAMMPS executable
        uses: actions/upload-artifact@v7
        with:
          name: executable
          path: ${{ github.workspace }}/lammps/build/lmp
          retention-days: 1
          
  test_mbxlammps:
    strategy:
      fail-fast: false
      matrix:
        example: [256h2o, 512h2o, 1024h2o, 2048h2o, na+_bulk, ch4]
    runs-on: [self-hosted]
    needs: compile-mbxlammps
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "The workflow is now ready to test your code on the runner."
      - name: Download executable from compilation
        uses: actions/download-artifact@v8
        with:
          name: executable
      - run: ls ${{ github.workspace }} -lth
      
      - name: testing example ${{ matrix.example }}
        run: |
          chmod u+x lmp
          ls -lth ${{ github.workspace }}/lmp
          cd ${{ github.workspace }}/plugins/lammps/examples/${{ matrix.example }}/
          export OMP_NUM_THREADS=${{ github.event.inputs.omp }}
          ${{ github.workspace }}/lmp -in in.*
      - run: ls -lth ${{ github.workspace }}/plugins/lammps/examples/${{ matrix.example }}/
      - name: log output
        run: cat ${{ github.workspace }}/plugins/lammps/examples/${{ matrix.example }}/log.lammps
      - name: Upload logfile
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.example }}_log.lammps
          path: ${{ github.workspace }}/plugins/lammps/examples/${{ matrix.example }}/log.lammps
          retention-days: 7
      - name: run validate_example.py
        run: python3 ${{ github.workspace }}/plugins/lammps/examples/validate_example.py ${{ github.workspace }}/plugins/lammps/examples/${{ matrix.example }}

  valgrind_mbxlammps:
    if: ${{ inputs.valgrind_check }}
    runs-on: [self-hosted]
    needs: test_mbxlammps
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: Download executable from compilation
        uses: actions/download-artifact@v8
        with:
          name: executable
      - run: ls ${{ github.workspace }} -lth

      - name: Valgrind leak check 1024h2o
        run: |
          set -o pipefail
          chmod u+x lmp
          cd ${{ github.workspace }}/plugins/lammps/examples/1024h2o/
          export OMP_NUM_THREADS=${{ github.event.inputs.omp }}
          valgrind --leak-check=full --show-leak-kinds=all ${{ github.workspace }}/lmp -in in.* 2>&1 | tee valgrind.log

          definitely_lost=$(awk '/definitely lost:/ { gsub(/,/, "", $4); print $4 }' valgrind.log | tail -n 1)
          indirectly_lost=$(awk '/indirectly lost:/ { gsub(/,/, "", $4); print $4 }' valgrind.log | tail -n 1)
          possibly_lost=$(awk '/possibly lost:/ { gsub(/,/, "", $4); print $4 }' valgrind.log | tail -n 1)

          definitely_lost=${definitely_lost:-0}
          indirectly_lost=${indirectly_lost:-0}
          possibly_lost=${possibly_lost:-0}

          echo "Valgrind definitely lost: ${definitely_lost} bytes"
          echo "Valgrind indirectly lost: ${indirectly_lost} bytes"
          echo "Valgrind possibly lost: ${possibly_lost} bytes"

          {
            echo "### Valgrind leak summary"
            echo ""
            echo "| Leak kind | Bytes |"
            echo "| --- | ---: |"
            echo "| Definitely lost | ${definitely_lost} |"
            echo "| Indirectly lost | ${indirectly_lost} |"
            echo "| Possibly lost | ${possibly_lost} |"
          } >> "$GITHUB_STEP_SUMMARY"

          detected_leaks=""
          if [ "${definitely_lost}" -gt 0 ]; then
            detected_leaks="${detected_leaks} definitely lost (${definitely_lost} bytes)"
          fi
          if [ "${indirectly_lost}" -gt 0 ]; then
            detected_leaks="${detected_leaks} indirectly lost (${indirectly_lost} bytes)"
          fi
          if [ "${possibly_lost}" -gt 0 ]; then
            detected_leaks="${detected_leaks} possibly lost (${possibly_lost} bytes)"
          fi

          if [ -n "${detected_leaks}" ]; then
            echo "Valgrind detected nonzero leak bytes:${detected_leaks}"
            exit 1
          fi
      - name: Upload Valgrind logfile
        uses: actions/upload-artifact@v7
        with:
          name: 1024h2o_valgrind.log
          path: ${{ github.workspace }}/plugins/lammps/examples/1024h2o/valgrind.log
          retention-days: 7
